[project]
name = "axiom"
version = "0.1.0"
description = "Axiom: agentic market-intelligence backend (MCP server, multi-agent analysts, honest quant)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "mcp>=1.2,<2",  # FastMCP (v1 API); v2 renames it to MCPServer
    "yfinance>=0.2.40",
    "defusedxml>=0.7",
    "openai>=1.40,<3",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
    "tenacity>=8.5",
    "apscheduler>=3.10",
    "psycopg[binary]>=3.2",  # Postgres (Neon) when DATABASE_URL is set; SQLite otherwise
]

[project.optional-dependencies]
actions = ["composio>=0.8"]  # real Notion/Sheets/Slack execution; dry-run works without it

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["axiom"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is handled by `ruff format`

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# UNTESTED. Written to mirror the GitHub Actions "angular" job in .github/workflows/ci.yml,
# but it has never been run on Azure DevOps. Treat it as a starting point, not a working pipeline.
trigger:
  branches: { include: [main] }
  paths: { include: [angular/*] }

pool:
  vmImage: ubuntu-latest

variables:
  workDir: angular

steps:
  - task: NodeTool@0
    inputs: { versionSpec: '24.x' }
    displayName: Use Node 24

  - script: npm ci
    workingDirectory: $(workDir)
    displayName: Install

  - script: npm run lint
    workingDirectory: $(workDir)
    displayName: Lint

  - script: npx ng test --watch=false
    workingDirectory: $(workDir)
    displayName: Test

  - script: npx ng build --configuration production
    workingDirectory: $(workDir)
    displayName: Build

  - script: docker build -t axiom-watch .
    workingDirectory: $(workDir)
    displayName: Docker build (no push)

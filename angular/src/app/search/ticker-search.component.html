<div class="search surface">
  <label for="ticker-search" class="label">Add a ticker</label>
  <input
    id="ticker-search"
    class="field"
    type="text"
    role="combobox"
    autocomplete="off"
    spellcheck="false"
    placeholder="Symbol or company, e.g. NVDA or Nvidia"
    aria-autocomplete="list"
    aria-controls="ticker-results"
    aria-describedby="ticker-search-status"
    [attr.aria-expanded]="showList()"
    [attr.aria-activedescendant]="showList() && active() >= 0 ? 'ticker-opt-' + active() : null"
    [formControl]="query"
    (keydown)="onKeydown($event)"
    (focus)="open.set(true)"
    (blur)="open.set(false)"
  />
  <ul id="ticker-results" role="listbox" aria-label="Matching tickers" class="results" [hidden]="!showList()">
    @for (m of results(); track m.ticker; let i = $index) {
      <li
        role="option"
        [id]="'ticker-opt-' + i"
        [attr.aria-selected]="i === active()"
        [attr.aria-disabled]="watched().has(m.ticker)"
        [class.active]="i === active()"
        (mousedown)="$event.preventDefault(); pick(m)"
      >
        <span class="mono sym">{{ m.ticker }}</span>
        <span class="name">{{ m.name }}</span>
        @if (watched().has(m.ticker)) {
          <span class="caption muted">On your list</span>
        }
      </li>
    }
  </ul>
  <p id="ticker-search-status" class="status caption muted" role="status">{{ statusText() }}</p>
</div>

name: CI
on: [push, pull_request]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:  # the Store and cache run on SQLite and Postgres; the portability tests need a real one
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AXIOM_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra actions
      # Vercel installs from requirements.txt, so it must match uv.lock
      - run: |
          uv export --no-dev --no-hashes --no-emit-project -o /tmp/req.txt
          diff <(grep -v "uv export\|autogenerated" /tmp/req.txt) <(grep -v "uv export\|autogenerated" requirements.txt)
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      # evals replay recorded model outputs: deterministic and free, no API keys needed
      - run: uv run python -m evals.run --mode replay --recording evals/recordings/qwen3-8b.jsonl --report /tmp/eval.md --json /tmp/eval.json
